<!DOCTYPE html>
<html lang="en" style="background:#1e1e1e">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Editor</title>
    <!-- Prevent white flash: inline dark background before any CSS loads -->
    <style>
        /* ── Boot-hidden mode: while the native startup overlay is up, this
           page must paint ONLY its flat dark background (the <html> inline
           style below). Chromium's native child window z-orders ABOVE the Qt
           startup overlay, so any visible content here (welcome logo, tags)
           would punch through and appear BESIDE the main loading screen -
           the old "two CORTEX splashes" boot bug. Python calls
           window.__cortexReveal() the moment the overlay is dismissed; the
           early head script below adds a 20s backstop so the page can never
           stay hidden. */
        html.boot-hidden body {
            visibility: hidden;
        }
    </style>
    <script>
        // Runs before first paint: enter boot-hidden mode only when the
        // Python side flagged this load as part of app boot (?boot=1).
        (function () {
            try {
                if (new URLSearchParams(window.location.search).get('boot') !== '1') return;
                var htmlEl = document.documentElement;
                htmlEl.classList.add('boot-hidden');
                var _revealed = false;
                window.__cortexReveal = function () {
                    if (_revealed) return;
                    _revealed = true;
                    htmlEl.classList.remove('boot-hidden');
                };
                setTimeout(window.__cortexReveal, 20000);
            } catch (e) { /* never block boot on this */ }
        })();
    </script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Monaco Editor uses its own box-model, don't override it */
        .monaco-editor *,
        .monaco-editor *::before,
        .monaco-editor *::after {
            box-sizing: content-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #1e1e1e;
            position: relative;
        }

        /* Tab Bar */
        #tab-bar {
            display: flex;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            height: 35px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
        }

        #tab-bar::-webkit-scrollbar {
            height: 3px;
        }

        #tab-bar::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 2px;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 35px;
            font-size: 13px;
            color: #969696;
            background: #2d2d2d;
            border-right: 1px solid #252526;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            min-width: 80px;
            flex-shrink: 0;
            gap: 8px;
        }

        .tab.active {
            color: #ffffff;
            background: #1e1e1e;
            border-bottom: 2px solid #0078d4;
        }

        .tab:hover:not(.active) {
            background: #2a2a2a;
        }

        .tab:focus-visible {
            outline: 2px solid #0078d4;
            outline-offset: -2px;
        }

        .tab.modified::before {
            content: '\25CF';
            color: #ffffff;
            font-size: 14px;
            margin-right: 2px;
        }

        .tab .close-btn {
            font-size: 14px;
            color: #969696;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 3px;
            margin-left: 4px;
        }

        .tab .close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .tab .close-btn:focus-visible {
            outline: 2px solid #0078d4;
            outline-offset: 1px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* No-open-files hint, Cortex branded */
        #no-files-hint {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
            gap: 8px;
            user-select: none;
        }

        /* ========== Cortex Ring Icon, AI Glow + Noise + Rotation ==========
     *
     * DESIGN CONCEPT: "The Cortex Core"
     * ──────────────────────────────────
     * The ring represents a neural loop, always processing, never sleeping.
     * Three layers work together:
     *   1. Gradient Ring (Purple → Cyan), conic gradient, ring-shaped via mask
     *   2. Neural Noise, drifting fractal texture that feels like raw AI computation
     *   3. Aura Halo, soft radial glow that breathes with the ring
     *
     * BEHAVIOR:
     *   - Entry: fades in + scales up over 1.5s when page loads
     *   - Breathing: opacity pulses 0.65→0.90 over 5s (slower = more hypnotic)
     *   - Rotation: ring spins 360° every 25s (too fast = distracting)
     *   - Hover: ring brightens, spins faster, halo expands, feels responsive
     *
     * ====================================================================== */

        /* ── Entry animation ── */
        @keyframes cortexEntry {
            0% {
                opacity: 0;
                transform: scale(0.6);
                filter: blur(4px);
            }

            60% {
                opacity: 0.9;
                transform: scale(1.05);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* ── Slow breathing glow ── */
        @keyframes cortexBreathe {
            0% {
                box-shadow: 0 0 14px rgba(245, 197, 24, 0.14), 0 0 44px rgba(245, 197, 24, 0.04);
                opacity: 0.65;
            }

            50% {
                box-shadow: 0 0 30px rgba(245, 197, 24, 0.42), 0 0 74px rgba(245, 197, 24, 0.12);
                opacity: 0.90;
            }

            100% {
                box-shadow: 0 0 14px rgba(245, 197, 24, 0.14), 0 0 44px rgba(245, 197, 24, 0.04);
                opacity: 0.65;
            }
        }

        /* ── Slow rotation ── */
        @keyframes cortexSpin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ── Faster spin on hover ── */
        @keyframes cortexSpinFast {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ── Neural noise drift ── */
        @keyframes cortexNoise {
            0% {
                transform: translate(0, 0) scale(1);
            }

            15% {
                transform: translate(-1.5%, -1%) scale(1.015);
            }

            30% {
                transform: translate(1%, -1.5%) scale(1.01);
            }

            45% {
                transform: translate(-1%, 1.5%) scale(1.02);
            }

            60% {
                transform: translate(1.5%, 1%) scale(0.99);
            }

            75% {
                transform: translate(-1.5%, -1.5%) scale(1.015);
            }

            90% {
                transform: translate(1%, 1%) scale(1.01);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* ── Brand mark: the Cortex hexagon-C logo as inline SVG (vector, no
           raster image). A gold gradient (dark→light yellow) slowly rotates
           so a bright band flows around the mark, the old purple "plasma"
           animator, recoloured and applied to the real logo. ── */
        #no-files-hint .cortex-icon-ring {
            /* The brand mark is square, where the wordmark it replaced was
               about 3:1. Keeping 300px would have made it three times taller
               than the logo it replaced and pushed the tagline off centre.
               104px keeps the same optical height on the welcome screen. */
            width: 104px;
            height: auto;
            margin-bottom: 16px;
            opacity: 0.96;
            /* No glow ring / breathing aura, just the clean logo. The only
               motion is the gradient flowing inside the mark (in the SVG)
               plus a one-time fade-in on load. */
            animation: cortexEntry 1.2s ease-out forwards;
            transition: filter 0.4s, transform 0.4s;
            cursor: pointer;
        }
        #no-files-hint .cortex-icon-ring .cortex-logo {
            width: 100%;
            height: auto;
            display: block;
            /* The welcome mark is decoration, not content. Chromium makes
               every <img> draggable by default, so it could be picked up and
               dropped into the terminal or the chat input, which then pasted
               the whole data URI as if the user had typed it. Decoration
               should not be draggable or selectable. */
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }
        #no-files-hint .cortex-icon-ring .cortex-logo-light { display: none; }
        body.light-theme #no-files-hint .cortex-icon-ring .cortex-logo-dark { display: none; }
        body.light-theme #no-files-hint .cortex-icon-ring .cortex-logo-light { display: block; }


        /* ── Hover: brighten + stronger gold glow ── */
        #no-files-hint .cortex-icon-ring:hover {
            opacity: 1 !important;
            filter: brightness(1.08) drop-shadow(0 0 16px rgba(37, 127, 216, 0.5));
            transform: scale(1.04);
        }

        /* ── Neural noise overlay (barely visible, feels subconscious) ── */
        #no-files-hint .cortex-icon-ring::after {
            display: none;  /* noise ring overlay retired with the ring mark */
        }

        /* ── Hover: noise becomes slightly more visible ── */
        #no-files-hint .cortex-icon-ring:hover::after {
            opacity: 0.18;
            transition: opacity 0.6s;
        }

        /* ── Glow aura retired: no circular ring behind the logo ── */
        #no-files-hint .cortex-icon-ring::before {
            display: none;
        }

        #no-files-hint .cortex-tagline {
            font-size: 22px;
            font-weight: 600;
            color: #cccccc;
            letter-spacing: 0.5px;
        }

        #no-files-hint .cortex-subtagline {
            font-size: 13px;
            color: #555555;
            font-style: italic;
        }

        /* Editor container */
        #editor-container {
            flex: 1;
            overflow: hidden;
        }

        #editor-container.hidden {
            display: none;
        }

        #image-preview {
            flex: 1;
            display: flex;
            width: 100%;
            background: #1e1e1e;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            gap: 10px;
        }

        #image-preview.hidden {
            display: none;
        }

        /* Spreadsheet preview (.xlsx/.xls/.csv) — same show/hide pattern as
           #image-preview. The flex layout MUST live here, not as an inline
           style on the div: an inline display:flex out-ranks the .hidden
           class, which made the grid impossible to hide once shown (the
           "sheet stuck under every .md/.py/.json tab" bug). */
        #sheet-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1e1e1e;
        }

        #sheet-preview.hidden {
            display: none;
        }

        /* ── Info bar: file name + read-only badge + actions ── */
        #sheet-preview-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #969696;
            font-size: 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex: 0 0 auto;
            user-select: none;
        }
        #sheet-preview-name {
            color: #ddd;
            font-weight: 600;
            max-width: 45%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #sheet-preview-readonly {
            background: rgba(0, 120, 212, 0.18);
            color: #6fb3e8;
            border: 1px solid rgba(0, 120, 212, 0.45);
            border-radius: 10px;
            padding: 1px 9px;
            font-size: 11px;
            flex: 0 0 auto;
        }
        #sheet-preview-dims { color: #777; }
        #sheet-preview-actions { margin-left: auto; }
        #sheet-copy-tsv {
            background: transparent;
            color: #969696;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            font-size: 11px;
            padding: 2px 10px;
            cursor: pointer;
            font-family: inherit;
        }
        #sheet-copy-tsv:hover { color: #fff; border-color: #0078d4; }
        #sheet-copy-tsv:focus-visible { outline: 2px solid #0078d4; outline-offset: 1px; }

        /* ── Grid body: scrollable, text selectable (copy works) ── */
        #sheet-preview-body {
            flex: 1 1 auto;
            overflow: auto;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 12px;
            color: #ddd;
            background: #1e1e1e;
        }
        #sheet-preview-body table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: auto;
        }
        #sheet-preview-body td,
        #sheet-preview-body th {
            border-right: 1px solid #2a2a2e;
            border-bottom: 1px solid #2a2a2e;
            padding: 3px 8px;
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: text;          /* copying cell text must work */
            cursor: default;
        }
        #sheet-preview-body td.sp-active {
            outline: 2px solid #0078d4;
            outline-offset: -2px;
        }
        #sheet-preview-body td.sp-fx {    /* formula we could not compute */
            color: #8a8a8a;
            font-style: italic;
        }
        /* Column-letter header row + row-number column, sticky like Sheets */
        #sheet-preview-body thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #252526;
            color: #969696;
            font-weight: 600;
            text-align: center;
            min-width: 34px;
            user-select: none;
            cursor: default;
        }
        #sheet-preview-body td.sp-rownum,
        #sheet-preview-body thead th.sp-corner {
            position: sticky;
            left: 0;
            z-index: 2;
            background: #252526;
            color: #969696;
            font-weight: 600;
            text-align: center;
            min-width: 40px;
            user-select: none;
            cursor: default;
        }
        #sheet-preview-body thead th.sp-corner { z-index: 4; }
        #sheet-preview-body tbody tr:nth-child(even) td:not(.sp-rownum) {
            background-color: rgba(255, 255, 255, 0.025);
        }
        #sheet-preview-body .sp-trunc {
            color: #888;
            font-style: italic;
            padding: 8px;
        }
        #sheet-preview-body .sp-error {
            color: #f66;
            padding: 16px;
        }

        /* ── Bottom sheet tabs, Excel/Sheets style ── */
        #sheet-tabs {
            display: flex;
            align-items: stretch;
            gap: 2px;
            background: #18181c;
            border-top: 1px solid #2a2a2e;
            padding: 0 8px;
            flex: 0 0 auto;
            overflow-x: auto;
            min-height: 30px;
            user-select: none;
        }
        #sheet-tabs.hidden { display: none; }
        #sheet-tabs button {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #969696;
            font-size: 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        #sheet-tabs button:hover { color: #ddd; background: rgba(255,255,255,0.05); }
        #sheet-tabs button.sp-tab-active {
            color: #fff;
            border-bottom-color: #0078d4;
            background: #1e1e1e;
        }
        #sheet-tabs button:focus-visible { outline: 2px solid #0078d4; outline-offset: -2px; }

        /* PDF page images (pre-rendered by PyMuPDF, one <img> per page) */
        #sheet-preview-body img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ── Oversized-file notice ────────────────────────────────────────
           Read-only tab shown instead of loading a file above the editor's
           size ceiling. Owns the panel like #image-preview / #sheet-preview
           (flex:1 sibling), so the flex layout lives here, not inline. */
        #too-large-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #1e1e1e;
            padding: 24px;
        }
        #too-large-view.hidden { display: none; }
        .too-large-card {
            max-width: 560px;
            text-align: center;
            font-family: var(--font-ui);
            color: #cccccc;
        }
        .too-large-icon {
            font-size: 40px;
            line-height: 1;
            color: #d7a44a;
            margin-bottom: 14px;
        }
        .too-large-title {
            font-size: 16px;
            font-weight: 600;
            color: #e6e6e6;
            margin-bottom: 10px;
        }
        .too-large-name {
            font-family: var(--font-mono, monospace);
            font-size: 13px;
            color: #6fb3e8;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .too-large-detail {
            font-size: 13px;
            color: #969696;
            margin-bottom: 16px;
        }
        .too-large-hint {
            font-size: 12px;
            line-height: 1.6;
            color: #8a8a8a;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
        }
        .too-large-hint code {
            font-family: var(--font-mono, monospace);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            padding: 1px 5px;
            color: #cccccc;
        }
        body.light-theme #too-large-view { background: #E4E1D8; }
        body.light-theme .too-large-card { color: #3A3833; }
        body.light-theme .too-large-title { color: #1A1814; }
        body.light-theme .too-large-name { color: #0a5a99; }
        body.light-theme .too-large-detail { color: #6B6860; }
        body.light-theme .too-large-hint {
            color: #6B6860;
            border-top-color: rgba(26, 24, 20, 0.12);
        }
        body.light-theme .too-large-hint code {
            background: rgba(26, 24, 20, 0.08);
            color: #1A1814;
        }

        body.light-theme #sheet-preview { background: #E4E1D8; }
        body.light-theme #sheet-preview-info {
            color: #6B6860;
            border-bottom-color: rgba(26, 24, 20, 0.12);
        }
        body.light-theme #sheet-preview-name { color: #1A1814; }
        body.light-theme #sheet-preview-readonly {
            background: rgba(0, 120, 212, 0.1);
            color: #005a9e;
            border-color: rgba(0, 90, 158, 0.4);
        }
        body.light-theme #sheet-preview-body { color: #1A1814; background: #fbfaf7; }
        body.light-theme #sheet-preview-body td,
        body.light-theme #sheet-preview-body th {
            border-color: rgba(26, 24, 20, 0.25);
        }
        body.light-theme #sheet-preview-body thead th,
        body.light-theme #sheet-preview-body td.sp-rownum {
            background: #eceae4;
            color: #6B6860;
        }
        body.light-theme #sheet-preview-body tbody tr:nth-child(even) td:not(.sp-rownum) {
            background-color: rgba(26, 24, 20, 0.03);
        }
        body.light-theme #sheet-tabs { background: #ddd9d0; border-top-color: rgba(26,24,20,0.2); }
        body.light-theme #sheet-tabs button { color: #6B6860; }
        body.light-theme #sheet-tabs button.sp-tab-active { color: #1A1814; background: #fbfaf7; }

        /* File Path Breadcrumb Bar */
        #file-path-bar {
            display: none;
            align-items: center;
            background: #18181c;
            border-bottom: 1px solid #2a2a2e;
            padding: 0 16px;
            font-size: 12px;
            color: #888;
            flex-shrink: 0;
            gap: 0;
            height: 32px;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.01em;
        }

        #file-path-bar.visible {
            display: flex;
        }

        #file-path-bar .path-sep {
            color: #5a7d9a;
            margin: 0 6px;
            font-size: 11px;
            font-weight: 700;
            opacity: 0.85;
            user-select: none;
        }

        #file-path-bar .path-part {
            color: #6a737d;
            cursor: default;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
        }

        #file-path-bar .path-part:hover {
            color: #9ea7b0;
            background: rgba(255, 255, 255, 0.04);
        }

        #file-path-bar .path-part:last-child {
            color: #d4d8dd;
            font-weight: 600;
            font-size: 12.5px;
        }

        #file-path-parts {
            display: flex;
            align-items: center;
            min-width: 0;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            mask-image: linear-gradient(to right, transparent 0px, black 12px, black calc(100% - 12px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 12px, black calc(100% - 12px), transparent 100%);
        }

        #file-path-bar .copy-path-btn {
            margin-left: auto;
            background: none;
            border: 1px solid transparent;
            color: #5a6370;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
            letter-spacing: 0.02em;
        }

        #file-path-bar .copy-path-btn:hover {
            color: #c8cdd3;
            background: rgba(255, 255, 255, 0.06);
            border-color: #3a3d42;
        }

        #file-path-bar .copy-path-btn.copied {
            color: #4ec9b0;
        }

        /* Dark theme only */

        /* Flash highlight for AI edit accept */
        .flash-highlight {
            background: rgba(78, 201, 176, 0.12) !important;
            animation: flash-fade 1.5s ease-out forwards;
        }

        @keyframes flash-fade {
            0% {
                background: rgba(78, 201, 176, 0.25);
            }

            100% {
                background: transparent;
            }
        }

        /* ═══ LIGHT THEME, activated by body.light-theme via setTheme(false).
           Palette: warm Anthropic/Claude scheme, MATCHES memory_management.css
           [data-theme="light"] (bg #ECE9E0, surfaces #E4E1D8/#DDDAD0, text
           #1A1814, terracotta accent #C96A3E). Rule: light backgrounds get
           DARK text, never light-hash gray. ═══ */
        body.light-theme #app { background: #ECE9E0; }
        body.light-theme #tab-bar { background: #E4E1D8; border-bottom-color: #CCC9C0; }
        body.light-theme #tab-bar::-webkit-scrollbar-thumb { background: #A8A59E; }
        body.light-theme .tab { color: #6B6860; background: #DDDAD0; border-right-color: #CCC9C0; }
        body.light-theme .tab.active { color: #1A1814; background: #ECE9E0; border-bottom-color: #C96A3E; }
        body.light-theme .tab:hover:not(.active) { background: #D6D3CA; }
        body.light-theme .tab.modified::before { color: #1A1814; }
        body.light-theme .tab .close-btn { color: #6B6860; }
        body.light-theme .tab .close-btn:hover,
        body.light-theme .tab .close-btn:focus-visible { color: #1A1814; background: rgba(26, 24, 20, 0.10); }
        body.light-theme #file-path-bar { background: #E4E1D8; border-bottom-color: #CCC9C0; color: #6B6860; }
        body.light-theme #file-path-bar .path-sep { color: #A8A59E; }
        body.light-theme #file-path-bar .path-part { color: #6B6860; }
        body.light-theme #file-path-bar .path-part:hover { color: #1A1814; background: rgba(26, 24, 20, 0.05); }
        body.light-theme #file-path-bar .path-part:last-child { color: #1A1814; }
        /* Empty-state welcome text, was hardcoded #cccccc/#555555 (calibrated
           for the dark background), reading as washed-out light gray on the
           light warm-beige page. */
        body.light-theme #no-files-hint .cortex-tagline { color: #1A1814; }
        body.light-theme #no-files-hint .cortex-subtagline { color: #6B6860; }

        /* ================================================
           READ-ONLY DIFF VIEW (Changes panel -> Monaco)
           A self-contained side-by-side diff that overlays
           the editor. Kept separate from the tab system so
           it never destabilizes session-restore/tab state.
           ================================================ */
        #diff-view {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #1e1e1e;
            overflow: hidden;
        }
        #diff-view.visible {
            display: flex;
        }
        /* While a diff is open it owns the panel.
           #no-files-hint, #editor-container, #image-preview and
           #sheet-preview are flex:1 siblings of #diff-view, and several
           paths re-show them without knowing a diff is open: renderTabs()
           (run on every open, close, switch and rename), closeFile() on the
           last tab, and closeAllFiles(). Any one of them split the panel in
           half - the welcome screen, or an editor, above a half-height diff.
           That is the "file opened in the background, then closed" case: the
           close re-rendered the tabs after the diff was already showing.
           A stylesheet !important beats their inline display:flex, so this
           holds for every current and future path. closeDiff() restores
           them as before. */
        #app:has(> #diff-view.visible) > #no-files-hint,
        #app:has(> #diff-view.visible) > #editor-container,
        #app:has(> #diff-view.visible) > #image-preview,
        #app:has(> #diff-view.visible) > #sheet-preview {
            display: none !important;
        }
        /* Toolbar: file identity + change counts */
        .diff-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: #252526;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }
        .diff-toolbar .diff-chevron {
            color: #98a1ab;
            font-size: 11px;
            flex-shrink: 0;
            user-select: none;
        }
        .diff-toolbar .diff-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 3px;
            color: #fff;
            background: #0078d4;
            flex-shrink: 0;
        }
        .diff-toolbar .diff-filename {
            font-size: 13px;
            font-weight: 600;
            color: #e8e8e8;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .diff-toolbar .diff-dirname {
            font-size: 12px;
            color: #8b949e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        .diff-toolbar .diff-counts {
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 600;
            flex-shrink: 0;
        }
        .diff-toolbar .diff-counts .diff-add { color: #56d364; }
        .diff-toolbar .diff-counts .diff-del { color: #f85149; }
        .diff-toolbar .diff-close-btn {
            background: transparent;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            border-radius: 4px;
            padding: 3px 12px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .diff-toolbar .diff-close-btn:hover {
            background: #3c3c3c;
            color: #ffffff;
        }
        .diff-toolbar .diff-close-btn:focus-visible {
            outline: 1px solid #0078d4;
            outline-offset: 1px;
        }
        #diff-container {
            flex: 1;
            overflow: auto;
            display: block;
            overflow-x: auto;
            overflow-y: auto;
            min-width: 0;
            /* Monaco overlay scrollbar: thin translucent thumb, no Windows chrome. */
            scrollbar-width: thin;
            scrollbar-color: rgba(121, 121, 121, 0.4) transparent;
        }
        #diff-container::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        #diff-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #diff-container::-webkit-scrollbar-thumb {
            background: rgba(121, 121, 121, 0.4);
            border-radius: 6px;
            border: 2px solid transparent;
            background-clip: padding-box;
            min-height: 24px;
            min-width: 24px;
        }
        #diff-container::-webkit-scrollbar-thumb:hover {
            background: rgba(191, 191, 191, 0.55);
            background-clip: padding-box;
        }
        #diff-container::-webkit-scrollbar-thumb:active {
            background: rgba(191, 191, 191, 0.7);
            background-clip: padding-box;
        }
        #diff-container::-webkit-scrollbar-corner {
            background: transparent;
        }
        #diff-container::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }
        /* Inline unified diff: single gutter, sign column, and no wrapping.
           One source line = one visual row (Monaco editor behaviour); long
           lines are revealed by a horizontal scrollbar, not broken onto a
           second line. */
        .diff-body {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 20px;
            padding: 4px 0 12px;
            width: max-content;
            min-width: 100%;
        }
        .drow {
            display: grid;
            grid-template-columns: 56px 16px auto;
            align-items: start;
            width: max-content;
            min-width: 100%;
        }
        .dnum {
            color: #6e7681;
            text-align: right;
            padding: 0 8px 0 0;
            user-select: none;
            font-size: 12px;
            line-height: 20px;
        }
        .dsign {
            text-align: center;
            user-select: none;
            font-size: 12px;
            line-height: 20px;
        }
        .dtext {
            /* One source line = one visual row. No wrapping: long lines are
               revealed by the horizontal scrollbar, exactly like the editor. */
            display: block;
            white-space: pre;
            tab-size: 4;
            -moz-tab-size: 4;
            word-break: normal;
            overflow-wrap: normal;
            padding-right: 16px;
            color: #d4d4d4;
            min-width: 0;
        }
        .drow.ctx:hover { background: rgba(255, 255, 255, 0.04); }
        .drow.del { background: rgba(248, 81, 73, 0.16); }
        .drow.del .dnum { color: #f0a9a4; }
        .drow.del .dsign { color: #f85149; }
        .drow.del .dtext { color: #ffd7d5; }
        .drow.add { background: rgba(63, 185, 80, 0.16); }
        .drow.add .dnum { color: #a4d6ab; }
        .drow.add .dsign { color: #56d364; }
        .drow.add .dtext { color: #d2f5d8; }
        /* Collapsed unchanged region between hunks */
        .dskip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            margin: 2px 0;
            color: #8b949e;
            background: #212223;
            border-top: 1px solid #2d2d2d;
            border-bottom: 1px solid #2d2d2d;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }
        .dskip:hover { background: #2a2b2c; color: #c9d1d9; }
        .dskip:focus-visible { outline: 1px solid #0078d4; outline-offset: -1px; }
        .dskip .dskip-chevron {
            font-size: 10px;
            color: #6e7681;
        }
        .dnodata {
            padding: 24px 16px;
            color: #98a1ab;
            font-size: 13px;
        }
        /* Right-click menu of the read-only views (diff, spreadsheet). The
           web view has no native menu (webview_panel.py), so without this
           there was no mouse way to copy from them. */
        .ro-menu {
            position: fixed;
            z-index: 1000;
            min-width: 140px;
            padding: 4px;
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 12px;
            user-select: none;
        }
        .ro-menu-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 5px 10px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: #cccccc;
            font: inherit;
            cursor: pointer;
        }
        .ro-menu-item:hover:not(:disabled),
        .ro-menu-item:focus-visible { background: #04395e; color: #ffffff; outline: none; }
        .ro-menu-item:disabled { color: #6e7681; cursor: default; }
        body.light-theme .ro-menu { background: #F4F2EC; border-color: #CCC9C0; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); }
        body.light-theme .ro-menu-item { color: #1A1814; }
        body.light-theme .ro-menu-item:hover:not(:disabled),
        body.light-theme .ro-menu-item:focus-visible { background: #E4E1D8; color: #1A1814; }
        body.light-theme .ro-menu-item:disabled { color: #9a968c; }
        body.light-theme #diff-view { background: #ECE9E0; }
        body.light-theme .diff-toolbar { background: #E4E1D8; border-bottom-color: #CCC9C0; }
        body.light-theme .diff-toolbar .diff-chevron { color: #6B6860; }
        body.light-theme .diff-toolbar .diff-badge { background: #C96A3E; }
        body.light-theme .diff-toolbar .diff-filename { color: #1A1814; }
        body.light-theme .diff-toolbar .diff-dirname { color: #6B6860; }
        body.light-theme .diff-toolbar .diff-counts .diff-add { color: #2f8132; }
        body.light-theme .diff-toolbar .diff-counts .diff-del { color: #c0392b; }
        body.light-theme .diff-toolbar .diff-close-btn { border-color: #CCC9C0; color: #6B6860; }
        body.light-theme .diff-toolbar .diff-close-btn:hover { background: rgba(26, 24, 20, 0.08); color: #1A1814; }
        body.light-theme #diff-container {
            scrollbar-color: rgba(107, 104, 96, 0.4) transparent;
        }
        body.light-theme #diff-container::-webkit-scrollbar-thumb {
            background: rgba(107, 104, 96, 0.4);
            background-clip: padding-box;
        }
        body.light-theme #diff-container::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 104, 96, 0.6);
            background-clip: padding-box;
        }
        body.light-theme .dtext { color: #1A1814; }
        body.light-theme .dnum { color: #6B6860; }
        body.light-theme .drow.ctx:hover { background: rgba(26, 24, 20, 0.05); }
        body.light-theme .drow.del { background: #ffebe9; }
        body.light-theme .drow.del .dnum { color: #822727; }
        body.light-theme .drow.del .dsign { color: #c0392b; }
        body.light-theme .drow.del .dtext { color: #5c2223; }
        body.light-theme .drow.add { background: #e6ffec; }
        body.light-theme .drow.add .dnum { color: #22623a; }
        body.light-theme .drow.add .dsign { color: #2f8132; }
        body.light-theme .drow.add .dtext { color: #1c4532; }
        body.light-theme .dskip { background: #E4E1D8; border-color: #CCC9C0; color: #6B6860; }
        body.light-theme .dskip:hover { background: #DDD9CF; color: #1A1814; }
        body.light-theme .dskip .dskip-chevron { color: #8A877E; }
        body.light-theme .dnodata { color: #6B6860; }
    </style>
</head>

function updateFilePathBar() {

function _humanBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

    document.getElementById('too-large-name').textContent = name;

    document.getElementById('editor-container').classList.add('hidden');
    document.getElementById('no-files-hint').style.display = 'none';
    hideImagePreview();
    hideSheetPreview();
    document.getElementById('too-large-view').classList.remove('hidden');

// Called by Python: openTooLarge(path, sizeChars, language, activate, name)
function openTooLarge(filePath, sizeChars, language, activate, displayName) {
    if (activate === undefined) activate = true;
    var _hint = document.getElementById('no-files-hint');
    if (_hint) _hint.style.display = 'none';
    var shouldActivate = activate && (_intendedActiveFile === null || filePath === _intendedActiveFile);

            path: filePath,

                if (m.cs > 1) attrs += ' colspan="' + m.cs + '"';
                if (m.rs > 1) attrs += ' rowspan="' + m.rs + '"';
            }
            if (cell !== null && typeof cell === 'object') {
                var _col = _spCellColors(cell);
                if (_col.bg) style += 'background:' + _col.bg + ';';
                if (_col.fg) style += 'color:' + _col.fg + ';';
                if (cell.b) style += 'font-weight:600;';
                if (cell.i) style += 'font-style:italic;';
                if (cell.fx) cls += ' sp-fx';
                var al = cell.al || (_SP_NUM_RE.test(text) ? 'r' : '');
                if (al === 'r') style += 'text-align:right;';
                else if (al === 'c') style += 'text-align:center;';
            } else if (_SP_NUM_RE.test(text)) {
                style += 'text-align:right;';   // numbers right-aligned, like Excel
            }
            html.push('<td' + attrs + (style ? ' style="' + style + '"' : '') +
                      (cls ? ' class="' + cls.trim() + '"' : '') + '>' +
                      _spEsc(text) + '</td>');
        }
        html.push('</tr>');
    }
    if (sh.trunc_rows) {
        html.push('<tr><td class="sp-trunc" colspan="' + (sh.n_cols + 1) +
                  '">… first ' + sh.rows.length + ' rows shown</td></tr>');
    }
    html.push('</tbody></table>');
    st.cache[idx] = html.join('');
    return st.cache[idx];
}

function _renderSheetTabs(fp) {

// ── Sheet copy interactions ──
// QWebEngineView has no default right-click menu, so copying must be
// bulletproof three ways: (1) plain drag-select + Ctrl+C works because
// cells are user-select:text; (2) click a cell to make it the active cell,
// Ctrl+C with no selection copies it through the Python clipboard bridge;
// (3) double-click selects the whole cell text; (4) "Copy sheet" copies
// the entire visible sheet as TSV.
(function () {
    var _activeCell = null;

    function _clearActive() {
        if (_activeCell) { _activeCell.classList.remove('sp-active'); _activeCell = null; }
    }

    document.addEventListener('mousedown', function (e) {
        var body = document.getElementById('sheet-preview-body');
        if (!body || !body.contains(e.target)) { _clearActive(); return; }
        var td = e.target.closest ? e.target.closest('td') : null;
        if (!td || td.classList.contains('sp-rownum')) { _clearActive(); return; }
        _clearActive();
        _activeCell = td;
        td.classList.add('sp-active');
    });

    document.addEventListener('dblclick', function (e) {
        var body = document.getElementById('sheet-preview-body');
        if (!body || !body.contains(e.target)) return;
        var td = e.target.closest ? e.target.closest('td') : null;
        if (!td || td.classList.contains('sp-rownum')) return;
        try {
            var sel = window.getSelection();
            var range = document.createRange();
            range.selectNodeContents(td);
            sel.removeAllRanges();
            sel.addRange(range);
        } catch (err) { /* selection unsupported - ignore */ }
    });

    document.addEventListener('keydown', function (e) {
        if (!((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey &&
              (e.key === 'c' || e.key === 'C'))) return;
        var preview = document.getElementById('sheet-preview');
        if (!preview || preview.classList.contains('hidden')) return;
        var sel = window.getSelection();
        if (sel && String(sel.toString())) return;   // native copy of drag selection
        if (_activeCell && window.bridge && bridge.copyToClipboard) {
            e.preventDefault();
            bridge.copyToClipboard(_activeCell.textContent);
        }
    });

    var _copyBtn = document.getElementById('sheet-copy-tsv');
    if (_copyBtn) _copyBtn.addEventListener('click', function () {
        var st = _sheetState[activeFilePath];
        if (!st) return;
        var sh = st.model.sheets[st.active];
        if (!sh) return;
        var tsv = sh.rows.map(function (row) {
            return row.map(_spCellText).join('\t');
        }).join('\n');
        if (window.bridge && bridge.copyToClipboard) {
            bridge.copyToClipboard(tsv);
            _copyBtn.textContent = 'Copied ✓';
            setTimeout(function () { _copyBtn.textContent = 'Copy sheet'; }, 1500);
        }
    });
})();

// ── Copy from the read-only views (diff, spreadsheet) ──
// Both are plain page text, not Monaco, and nothing in them can be edited.
// Drag-select always worked, but copying did not: Ctrl+C reached no copy
// handler (the app's Edit > Copy targets the code editor) and the view has
// no native right-click menu. Ctrl+C and a right-click "Copy" now send the
// selected text through the Python clipboard bridge. A sheet selection
// across cells copies as tab-separated rows, so it pastes into a sheet.
(function () {
    var _menu = null;

    function _roView() {
        var dv = document.getElementById('diff-view');
        if (dv && dv.classList.contains('visible')) return document.getElementById('diff-container');
        var sp = document.getElementById('sheet-preview');
        if (sp && !sp.classList.contains('hidden')) return document.getElementById('sheet-preview-body');
        return null;
    }

    function _selectedIn(root) {
        var sel = window.getSelection();
        if (!root || !sel || sel.isCollapsed) return '';
        var node = sel.anchorNode;
        if (node && node.nodeType !== 1) node = node.parentNode;
        return (node && root.contains(node)) ? String(sel) : '';
    }

    function _copy(text) {
        if (!text || !(window.bridge && bridge.copyToClipboard)) return false;
        bridge.copyToClipboard(text);
        return true;
    }

    function _closeMenu() {
        if (_menu) { _menu.remove(); _menu = null; }
    }

    function _menuItem(label, enabled, run) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ro-menu-item';
        b.setAttribute('role', 'menuitem');
        b.textContent = label;
        b.disabled = !enabled;
        b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });  // keep the selection
        b.addEventListener('click', function () { run(); _closeMenu(); });
        return b;
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && _menu) { _closeMenu(); e.stopPropagation(); return; }
        if (!((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey &&
              (e.key === 'c' || e.key === 'C'))) return;
        if (_copy(_selectedIn(_roView()))) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    document.addEventListener('contextmenu', function (e) {
        var root = _roView();
        if (!root || !root.contains(e.target)) return;
        e.preventDefault();
        _closeMenu();
        var text = _selectedIn(root);
        var cell = (!text && e.target.closest) ? e.target.closest('td:not(.sp-rownum):not(.sp-trunc)') : null;
        if (cell && !root.contains(cell)) cell = null;
        _menu = document.createElement('div');
        _menu.className = 'ro-menu';
        _menu.setAttribute('role', 'menu');
        _menu.appendChild(_menuItem(cell ? 'Copy cell' : 'Copy', !!(text || cell), function () {
            _copy(text || cell.textContent);
        }));
        _menu.appendChild(_menuItem('Select all', true, function () {
            var target = root.querySelector('.diff-body, table') || root;
            var range = document.createRange();
            range.selectNodeContents(target);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }));
        document.body.appendChild(_menu);
        _menu.style.left = Math.max(4, Math.min(e.clientX, innerWidth - _menu.offsetWidth - 4)) + 'px';
        _menu.style.top = Math.max(4, Math.min(e.clientY, innerHeight - _menu.offsetHeight - 4)) + 'px';
    });

    document.addEventListener('mousedown', function (e) {
        if (_menu && !_menu.contains(e.target)) _closeMenu();
    }, true);
    window.addEventListener('blur', _closeMenu);
    window.addEventListener('resize', _closeMenu);
    document.addEventListener('scroll', _closeMenu, true);
})();

// Drop cached sheet models when a spreadsheet tab is closed so memory
// does not accumulate across a long session.
function _forgetSheetState(filePath) {

}

// Re-show the preview panel for an already-open image (neighbor activation
// after a tab close). Uses the dataUri/fileSize cached by showImagePreview().
function _restoreImagePreview(filePath) {

    var info = document.getElementById('image-preview-info');
    if (f.dataUri && img.src !== f.dataUri) img.src = f.dataUri;

// Called by Python: openFile(path, content, language, activate?)
function openFile(filePath, content, language, activate) {
    if (activate === undefined) activate = true;
    // Hide welcome screen immediately, prevents logo flash on first file open
    var _hint = document.getElementById('no-files-hint');
    if (_hint) _hint.style.display = 'none';
    // If a read-only diff is showing, opening a real file dismisses it
    var _diffViewEl = document.getElementById('diff-view');
    if (_diffViewEl) _diffViewEl.classList.remove('visible');
    // Gate: only activate if this file is still the intended active file.
    // Prevents queued openFile(path, ..., true) calls from overriding a
    // more recent user selection after async delivery delay.
    var shouldActivate = activate && (_intendedActiveFile === null || filePath === _intendedActiveFile);
    if (openFiles[filePath]) {
        // Already open, switch to it, update content if different.
        // ALWAYS clear the dirty flag: Python-pushed content is the source
        // of truth from disk.  This prevents the white dot from persisting
        // when a content-change comparison misses (race, same-content edit,
        // or double-delivery from the pump + switch_to_file flush).
        openFiles[filePath].modified = false;
        _updateTabModifiedClass(filePath, false);
        if (openFiles[filePath].content !== content) {
            openFiles[filePath].content = content;
            openFiles[filePath].language = language || openFiles[filePath].language;
            // Always update the model (even if not active) so that when the
            // user switches to this file they see fresh content, not stale.
            forceSetContent(filePath);
        }
        if (shouldActivate || !activeFilePath) switchToFile(filePath);
        else renderTabs();
        // ACK for already-open file update too
        if (bridge && bridge.onContentDelivered) {
            bridge.onContentDelivered(filePath, (content || '').length);
        }
        return;
    }

    // New file
    openFiles[filePath] = {
        path: filePath,
        language: language || 'plaintext',
        content: content || '',
        modified: false
    };
    openOrder.push(filePath);
    // FIX: Always switchToFile for new files, ensures the tab header
    // is rendered with the 'active' class and activeFilePath is set.
    // Previously, when shouldActivate was false and an active file existed,
    // only renderTabs() was called, which created the tab WITHOUT the
    // 'active' class, making it invisible against the dark tab bar.
    // This caused the "search result click opens file but no tab header" bug.
    switchToFile(filePath);

    // ── LSP: Immediately notify Python about the new file ──
    // Don't wait for the switch-settle timer, the LSP needs didOpen
    // as soon as the file enters the editor so diagnostics/completions
    // can start populating.  This is lightweight (single string message
    // through QWebChannel) and won't flood even during session restore
    // because Python's _open_file_js already throttles to 10s spacing.
    if (activate && bridge && bridge.notifyContentChanged) {
        bridge.notifyContentChanged(filePath, content || '', language || 'plaintext');
    }
    // ACK: Confirm content delivery to Python so _files_delivered_to_js
    // stays accurate.  Without this, Python must guess whether JS received
    // the content, and it guesses wrong after page crashes / warmup skips
    // (Fix 4, Race Condition #1).
    if (bridge && bridge.onContentDelivered) {
        bridge.onContentDelivered(filePath, (content || '').length);
    }
    // SAFETY NET: Force a deferred renderTabs() to guarantee the tab header
    // is always visible, even if switchToFile/renderTabs above had a DOM timing issue.
    // This fixes the "search result click opens file but no tab header" bug.
    setTimeout(renderTabs, 0);
}

function _loadTextFromUri(fileUri, onDone) {
    // Never hang forever on "// Loading...". Cross-folder file:// XHR in
    // QWebEngine (OneDrive / project path from temp editor page) can stall
    // without firing onerror. Timeout forces a Python fallback.
    var settled = false;
    function finish(text, err) {
        if (settled) return;
        settled = true;
        try { onDone(text || '', err || null); } catch (e) {}
    }
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', fileUri, true);
        xhr.timeout = 8000;
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                    var body = xhr.responseText || '';
                    // status 0 with empty body often means blocked/failed file://
                    if (!body && xhr.status === 0) {
                        finish('', 'empty file:// response');
                    } else {
                        finish(body, null);
                    }
                } else {
                    finish('', 'HTTP ' + xhr.status);
                }
            }
        };
        xhr.ontimeout = function() { finish('', 'XHR timeout'); };
        xhr.onerror = function() { finish('', 'XHR error'); };
        xhr.send();
        setTimeout(function() {
            if (!settled) {
                try { xhr.abort(); } catch (e) {}
                finish('', 'XHR watchdog timeout');
            }
        }, 9000);
    } catch (e) {
        finish('', String(e));
    }
}

// Called by Python: openFileFromUri(path, language, fileUri, activate?)
function openFileFromUri(filePath, language, fileUri, activate) {
    if (activate === undefined) activate = true;
    // Hide welcome screen immediately, prevents logo flash on first file open
    var _hint = document.getElementById('no-files-hint');
    if (_hint) _hint.style.display = 'none';
    var shouldActivate = activate && (_intendedActiveFile === null || filePath === _intendedActiveFile);

    if (!openFiles[filePath]) {
        openFiles[filePath] = {
            path: filePath,
            language: language || 'plaintext',
            content: '',
            modified: false
        };
        openOrder.push(filePath);
    } else {
        openFiles[filePath].language = language || openFiles[filePath].language;
        // If we already have real content (e.g. prior inline openFile), do NOT
        // wipe it back to "// Loading..." and wait on XHR. Single-click from
        // search/tree must keep showing the file immediately.
        var _existing = openFiles[filePath].content;
        if (_existing && _existing !== '// Loading...' &&
            String(_existing).indexOf('// Failed to load file:') !== 0) {
            if (shouldActivate || !activeFilePath) switchToFile(filePath);
            else renderTabs();
            return;
        }
    }

    var token = (fileLoadTokens[filePath] || 0) + 1;
    fileLoadTokens[filePath] = token;
    openFiles[filePath].content = '// Loading...';

    if (shouldActivate || !activeFilePath) switchToFile(filePath);
    else renderTabs();

    _loadTextFromUri(fileUri, function(text, err) {
        if (fileLoadTokens[filePath] !== token) return; // superseded
        if (!openFiles[filePath]) return; // closed while loading
        if (err) {
            // Ask Python to re-deliver from the content it already holds
            // (same-origin cache or inline openFile). Avoid permanent
            // "// Loading..." / "// Failed to load" on large files.
            console.warn('[Editor] large-file XHR failed: ' + err + ' for ' + filePath);
            openFiles[filePath].content = '// Loading...';
            if (activeFilePath === filePath && editor) setEditorContent(filePath);
            if (bridge && bridge.requestLargeFileContent) {
                try {
                    bridge.requestLargeFileContent(
                        filePath,
                        (openFiles[filePath] && openFiles[filePath].language) || language || 'plaintext'
                    );
                } catch (e) {
                    openFiles[filePath].content = '// Failed to load file: ' + err;
                    if (activeFilePath === filePath && editor) setEditorContent(filePath);
                }
            } else {
                openFiles[filePath].content = '// Failed to load file: ' + err;
                if (activeFilePath === filePath && editor) setEditorContent(filePath);
            }
            return;
        }
        openFiles[filePath].content = text || '';
        if (bridge && bridge.onContentDelivered) {
            try { bridge.onContentDelivered(filePath, (text || '').length); } catch (e) {}
        }
        if (activeFilePath === filePath && editor) setEditorContent(filePath);
    });
}

// Called by Python: closeFile(path)
function closeFile(filePath) {
    // closeFile log removed, was flooding error.txt
    if (!openFiles[filePath]) return;
    // Dispose this file's Monaco model to free memory (per-file model cleanup).
    try {
        var _cm = openFiles[filePath].model;
        if (_cm && !_cm.isDisposed()) {
            // If the editor is currently showing it, detach first.
            if (editor && editor.getModel() === _cm) editor.setModel(null);
            _cm.dispose();
        }
    } catch (e) {}
    delete openFiles[filePath];
    _forgetSheetState(filePath);
    var idx = openOrder.indexOf(filePath);
    if (idx >= 0) openOrder.splice(idx, 1);

    if (filePath === activeFilePath) {
        // Hide any open preview (image or spreadsheet) we were viewing
        hideImagePreview();
        hideSheetPreview();
        // Switch to next available file or hide editor
        if (openOrder.length > 0) {
            var nextIdx = Math.min(idx, openOrder.length - 1);
            activeFilePath = openOrder[nextIdx];
            if (openFiles[activeFilePath] && openFiles[activeFilePath].isImage) {
                _restoreImagePreview(activeFilePath);
            } else if (openFiles[activeFilePath] && openFiles[activeFilePath].isSheet) {
                _restoreSheetPreview(activeFilePath);
            } else if (openFiles[activeFilePath] && openFiles[activeFilePath].isTooLarge) {
                _restoreTooLarge(activeFilePath);
            } else {
                hideTooLarge();
                setEditorContent(activeFilePath);
            }
        } else {
            activeFilePath = null;
            // Keep model content, clearing it triggers tokenization that
            // makes the next openFile() more expensive (empty→content wave).
            // Just hide the editor area; the model will be overwritten on next open.
            hideTooLarge();
            document.getElementById('no-files-hint').style.display = 'flex';
            document.getElementById('editor-container').classList.add('hidden');
        }
        // Active tab changed (neighbor promoted or none left), sync Python.
        _notifyActiveFile();
    }
    renderTabs();
    // closeFile bridge log removed, was flooding error.txt
    // Always notify Python of file closures, suppressing onFileClosed during
    // switching windows (isSwitchingFile) causes _open_files to desync from
    // Monaco's actual open tabs. When a user clicks a file that was silently
    // closed, the fast-path switch_to_file() fails silently (Monaco no longer
    // has the file) and the editor shows nothing.
    //
    // onFileClosed is lightweight (single string arg, called infrequently)
    // and does NOT contribute to the QWebChannel flooding that crashes
    // Chromium during startup (that's model.setValue() + LSP markers).
    if (bridge) bridge.onFileClosed(filePath);
}

// Called by Python: closeAllFiles(), closes all files in one shot, no
// per-file bridge.onFileClosed() calls or intermediate setEditorContent().
function closeAllFiles() {
